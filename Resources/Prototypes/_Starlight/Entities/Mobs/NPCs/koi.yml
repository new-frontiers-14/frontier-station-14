- type: entity
  name: space koi
  id: BaseMobKoi
  parent: BaseMobCarp
  description: Result of hundreds of years of selective breeding and genetic engineering, a friendly and colourful variant of the common space carp.
  abstract: true
  components:
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: Sprite
    drawdepth: Mobs
    sprite: _Starlight/Mobs/Aliens/Kois/gold_black.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodCuredCarp
      amount: 2
    - id: MaterialToothSpaceCarp1
      amount: 1
      maxAmount: 4
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5
  - type: Tag
    tags:
    - DoorBumpOpener
    - CannotSuicide
  - type: StaticPrice
    price: -800
  - type: ToolRefinable
    refineResult:
    - id: FoodCuredCarp
      amount: 2
    - id: MaterialToothSpaceCarp1
      amount: 1
      maxAmount: 4
  - type: InteractionPopup
    successChance: 0.6
    interactSuccessString: petting-success-carp
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
  - type: Pacified
    disallowAllCombat: true

- type: entity
  parent: BaseMobKoi
  id: MobRedBlackKoi
  suffix: Red Black
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
