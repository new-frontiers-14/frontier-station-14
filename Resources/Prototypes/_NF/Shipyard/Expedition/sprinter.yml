# Shuttle Notes:
# KC label retained as a nod to the original design, despite the huge refactor.
- type: vessel
  id: Sprinter
  parent: BaseVessel
  name: KC Sprinter Mk.2
  description: Refurbished by BlueBird, the Sprinter Mk.2 is an expedition capable mercenary dropship built upon the original Sprinter by KesCo.
  price: 62000 # ~58k appraisal
  minpricemarkup: 1.1
  category: Medium
  group: Expedition
  shuttlePath: /Maps/_NF/Shuttles/Expedition/sprinter.yml
  guidebookPage: ShipyardSprinter
  class:
  - Expedition
  engine:
  - AME

- type: gameMap
  id: Sprinter
  mapName: 'KC Sprinter Mk.2'
  mapPath: /Maps/_NF/Shuttles/Expedition/sprinter.yml
  minPlayers: 0
  stations:
    Sprinter:
      stationProto: StandardFrontierExpeditionVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Sprinter {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
