# Chaplain Forms

# Filled Folder
- type: entity
  id: BoxFolderChaplain
  parent: BoxFolderBase
  name: Chaplain's Folder
  description: A folder filled with paperwork templates for Chaplains.
  suffix: Forms
  components:
  - type: Sprite
    layers:
    - state: folder-colormap
      color: "#4a4a4a"
    - state: folder-base
  - type: StorageFill
    contents:
    - id: PaperWrittenMarriageCertificate
    - id: PaperWrittenDeathCertificate
    - id: PaperWrittenExorcismCertificate
    - id: PaperWrittenConfirmationCertificate
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5

# Forms
