        - id: BorgModulePill
      #Janitor
      - !type:GroupSelector
        children:
        - id: BorgModuleAdvancedCleaning
        - id: BorgModuleAdvancedSprayNozzle
      #Engi
      - !type:GroupSelector
        children:
        - id: BorgModuleAdvancedTool
        - id: BorgModuleRCD
      #Salvage
      - !type:GroupSelector
        children:
        - id: BorgModuleAdvancedMining
      #Service
      - !type:GroupSelector
        children:
        - id: BorgModuleAdvancedClowning
        - id: AdvancedBorgModuleMusique
