  - type: EntityTableSpawner
    offset: 0.1
    table: !type:GroupSelector
      children:
      #Generic
      - !type:GroupSelector
        children:
        - id: BorgModuleCable
        - id: BorgModuleFireExtinguisher
        - id: BorgModuleInflatable
      #Medic
      - !type:GroupSelector
        children:
