- type: entity
  parent: GasMixer
  id: GasMixerOn
  suffix: On
  placement:
    mode: SnapgridCenter
  components:
    - type: GasMixer
      startOnMapInit: true

- type: entity
  parent: [GasMixerFlipped, GasMixerOn]
  id: GasMixerOnFlipped
  suffix: On, Flipped
  placement:
    mode: SnapgridCenter

- type: entity
  parent: GasMixerOn
  abstract: true
  id: GasMixerDistro
  components:
  - type: AtmosPipeColor
    color: '#0055CCFF'

- type: entity
  parent: GasMixerDistro
  id: GasMixerDistroSideNitrogen
  suffix: On, Distro, side N2
  components:
  - type: GasMixer
    inletOneConcentration: 0.21
    inletTwoConcentration: 0.79
  - type: GasMixerAutoSetup
    inletOneGas: Oxygen
    inletTwoGas: Nitrogen
  - type: MarkerLayers
    layers:
    - sprite: _NF/Structures/Piping/Atmospherics/gasmixer_overlay.rsi
      state: sideNitrogen
      map: [ "gasMixerDistroMappingOverlay" ]

- type: entity
  parent: GasMixerDistro
  id: GasMixerDistroSideOxygen
  suffix: On, Distro, side O2
  components:
  - type: GasMixer
    inletOneConcentration: 0.79
    inletTwoConcentration: 0.21
  - type: GasMixerAutoSetup
    inletOneGas: Nitrogen
    inletTwoGas: Oxygen
  - type: MarkerLayers
    layers:
    - sprite: _NF/Structures/Piping/Atmospherics/gasmixer_overlay.rsi
      state: sideOxygen
      map: [ "gasMixerDistroMappingOverlay" ]

- type: entity
  parent: [GasMixerFlipped, GasMixerDistroSideNitrogen]
  id: GasMixerDistroSideNitrogenFlipped
  suffix: On, Distro, side N2, Flipped
  components:
  - type: MarkerLayers
    layers:
    - sprite: _NF/Structures/Piping/Atmospherics/gasmixer_overlay.rsi
      state: sideNitrogenF
      map: [ "gasMixerDistroMappingOverlay" ]

- type: entity
  parent: [GasMixerFlipped, GasMixerDistroSideOxygen]
  id: GasMixerDistroSideOxygenFlipped
  suffix: On, Distro, side O2, Flipped
  components:
  - type: MarkerLayers
    layers:
    - sprite: _NF/Structures/Piping/Atmospherics/gasmixer_overlay.rsi
      state: sideOxygenF
      map: [ "gasMixerDistroMappingOverlay" ]

# Filter None
- type: entity
  parent: GasFilter
  id: GasFilterOn
  suffix: On
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      startOnMapInit: true

- type: entity
  parent: [GasFilterFlipped, GasFilterOn]
  id: GasFilterOnFlipped
  suffix: On, Flipped
  placement:
    mode: SnapgridCenter

# Filter Oxygen
- type: entity
  parent: GasFilter
  id: GasFilterOxygenOn
  suffix: On, Oxygen
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      startOnMapInit: true
      filterGases: [Oxygen]

- type: entity
  parent: [GasFilterFlipped, GasFilterOxygenOn]
  id: GasFilterOxygenOnFlipped
  suffix: On, Oxygen, Flipped
  placement:
    mode: SnapgridCenter

# Filter Nitrogen
- type: entity
  parent: GasFilter
  id: GasFilterNitrogenOn
  suffix: On, Nitrogen
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      startOnMapInit: true
      filterGases: [Nitrogen]

- type: entity
  parent: [GasFilterFlipped, GasFilterNitrogenOn]
  id: GasFilterNitrogenOnFlipped
  suffix: On, Nitrogen, Flipped
  placement:
    mode: SnapgridCenter

- type: entity
  parent: GasFilter
  id: GasFilterInline
  name: inline gas filter
  description: Filters gases from a pipenet without splitting it in two.
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Piping/Atmospherics/inlinegasfilter.rsi
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeTrinaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: gasFilter
          map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
    - type: GasFilter
      inlet: pipe
      outlet: pipe
    - type: NodeContainer
      nodes:
        pipe:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: Longitudinal
        filter:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: West
    - type: Construction
      graph: GasTrinaryStarlight
      node: inline_filter
