- type: entity
  parent: GasMixer
  id: GasMixerOn
  suffix: On
  placement:
    mode: SnapgridCenter
  components:
    - type: GasMixer
      startOnMapInit: true

- type: entity
  parent: [GasMixerFlipped, GasMixerOn]
  id: GasMixerOnFlipped
  suffix: On, Flipped
  placement:
    mode: SnapgridCenter

# Filter None
- type: entity
  parent: GasFilter
  id: GasFilterOn
  suffix: On
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      startOnMapInit: true

- type: entity
  parent: [GasFilterFlipped, GasFilterOn]
  id: GasFilterOnFlipped
  suffix: On, Flipped
  placement:
    mode: SnapgridCenter

# Filter Oxygen
- type: entity
  parent: GasFilter
  id: GasFilterOxygenOn
  suffix: On, Oxygen
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      startOnMapInit: true
      filterGases: [Oxygen]

- type: entity
  parent: [GasFilterFlipped, GasFilterOxygenOn]
  id: GasFilterOxygenOnFlipped
  suffix: On, Oxygen, Flipped
  placement:
    mode: SnapgridCenter

# Filter Nitrogen
- type: entity
  parent: GasFilter
  id: GasFilterNitrogenOn
  suffix: On, Nitrogen
  placement:
    mode: SnapgridCenter
  components:
    - type: GasFilter
      startOnMapInit: true
      filterGases: [Nitrogen]

- type: entity
  parent: [GasFilterFlipped, GasFilterNitrogenOn]
  id: GasFilterNitrogenOnFlipped
  suffix: On, Nitrogen, Flipped
  placement:
    mode: SnapgridCenter

- type: entity
  parent: GasFilter
  id: GasFilterInline
  name: inline gas filter
  description: Filters gases from a pipenet without splitting it in two.
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Piping/Atmospherics/inlinegasfilter.rsi
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeTrinaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: gasFilter
          map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
    - type: GasFilter
      inlet: pipe
      outlet: pipe
    - type: NodeContainer
      nodes:
        pipe:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: Longitudinal
        filter:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: West
    - type: Construction
      graph: GasTrinaryStarlight
      node: inline_filter
