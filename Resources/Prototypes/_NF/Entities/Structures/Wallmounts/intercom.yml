- type: entity
  id: BaseShuttleIntercom
  abstract: true
  components:
  - type: TelecomExempt
  - type: EncryptionKeyHolder
    keySlots: 2
    keysExtractionMethod: null # Field made nullable vs. wizden
    keysUnlocked: false
  - type: RadioMicrophone
    powerRequired: true
    unobstructedRequired: true
    listenRange: 2
    toggleOnInteract: false
  - type: RadioSpeaker
    toggleOnInteract: false
    outputChatType: Speak
  - type: Intercom
    startSpeakerOnMapInit: true
  - type: Speech
    speechVerb: Robotic
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ShuttleIntercom
    appendName: true

- type: entity
  parent: BaseShuttleIntercom
  id: ShuttleIntercomNfsd
  abstract: true
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyTraffic
      - EncryptionKeyNfsd

- type: entity
  parent: BaseShuttleIntercom
  id: ShuttleIntercomAntag
  abstract: true
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyTraffic
      - EncryptionKeyFreelance

- type: entity
  parent: BaseShuttleIntercom
  id: ShuttleIntercomSyndicate
  abstract: true
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyTraffic
      - EncryptionKeySyndie

- type: entity
  id: IntercomNfsd
  parent: IntercomSecurity
  suffix: NFSD
  components:
  - type: ContainerFill
    containers:
      board:
      - IntercomElectronics
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyNfsd
      - EncryptionKeyTraffic

- type: entity
  id: IntercomGreetingAlwaysOn
  parent: [BaseStructureIndestructible, Intercom]
  suffix: Greeting, Always On
  components:
  - type: ContainerFill
    containers:
      board:
      - IntercomElectronics
      key_slots:
      - EncryptionKeyGreeting
  - type: RadioSpeaker
    outputChatType: Speak
  - type: RadioMicrophone
  - type: EncryptionKeyHolder
    keySlots: 1
  - type: Intercom
    startSpeakerOnMapInit: true
    startMicrophoneOnMapInit: true
  - type: AccessReader
    access: [["NuclearOperative"]] # unchangeable, the trade crate gambit
  - type: ActivatableUIRequiresAccess
  - type: ApcPowerReceiver
    needsPower: false # magic - FIXME: radio microphone has order initialization issues
    
# Courtroom PA microphone.
- type: entity
  id: CourtMicrophone
  parent: BaseWallmountMetallic
  name: court microphone
  description: A courtroom microphone connected to the local public address system.
  suffix: Courtroom, Microphone
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Courtroom
    frequency: 1025
    listenRange: 2
    enabled: true
    powerRequired: true
    toggleOnInteract: false
    unobstructedRequired: true
  - type: ActiveListener
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/intercom.rsi
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
    - state: broadcasting
      shader: unshaded
  - type: Speech
    speechVerb: Robotic

# Courtroom PA speaker.
- type: entity
  id: CourtSpeaker
  parent: BaseWallmountMetallic
  name: court speaker
  description: A wall-mounted speaker for the courtroom public address system.
  suffix: Courtroom, Speaker
  components:
  - type: RadioSpeaker
    channels:
    - Courtroom
    enabled: true
    toggleOnInteract: false
    outputChatType: Speak
  - type: ActiveRadio
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/intercom.rsi
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
    - state: speaker
      shader: unshaded
  - type: Speech
    speechVerb: Robotic
