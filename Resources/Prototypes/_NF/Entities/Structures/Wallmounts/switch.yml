- type: entity
  id: LockableButtonMailCarrier
  suffix: Mail
  parent: LockableButton
  components:
  - type: AccessReader
    access: [["Mail"]]

- type: entity
  id: LockableButtonPirate
  suffix: Pirate
  parent: LockableButton
  components:
  - type: AccessReader
    access: [["Pirate"]]

- type: entity
  id: ButtonFrameThruster
  parent: ButtonFrame
  suffix: thruster
  description: It's a frame for a switch that toggles thrusters on or off.
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/switch_frame.rsi
    state: thruster
  - type: Construction
    graph: ButtonFrameGraph
    node: ButtonFrameThrusterNode

- type: entity
  id: ButtonFrameShutter
  parent: ButtonFrame
  suffix: Shutter
  description: It's a frame for a switch that opens or closes shutters.
  components:
