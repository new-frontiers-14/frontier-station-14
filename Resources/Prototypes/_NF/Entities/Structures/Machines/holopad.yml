- type: entity
  parent: HolopadLongRange
  id: NFHolopadShip
  name: bluespace holopad
  description: "A floor-mounted device for projecting holographic images to enable ship to ship communication."
  suffix: Ship
  components:
  - type: Telephone
    ringTone: /Audio/Machines/double_ring.ogg # change me to something funny
    listeningRange: 4
    compatibleRanges:
    #- Grid #disabled to allow for grid-grid holopads that can't be called externally
    - Map
    - Unlimited
    ignoreTelephonesOnSameGrid: false
  - type: Holopad
    useStationName: true
  - type: AccessReader
    access: [ [ "HeadOfSecurity" ] ]
  - type: PowerSwitch
  - type: Machine
    board: NFHolopadShipMachineCircuitboard

- type: entity
  parent: NFHolopadShip
  id: NFHolopadShipAntag
  suffix: Ship, Antag
  components:
  - type: Holopad
    useStationName: false
  - type: ApcPowerReceiver
    powerDisabled: true #starts off

- type: entity
  parent: Holopad
  id: NFHolopadGrid
  suffix: Local
  name: intra-ship holopad
  description: "A floor-mounted device for projecting holographic images to enable communication within a ship."
  components:
  - type: Holopad
    useStationName: false
  - type: AccessReader
    access: [ [ "Captain" ] ]
  - type: Telephone
    ringTone: /Audio/Machines/double_ring.ogg # change me to something funny. Maybe.
    listeningRange: 4
    compatibleRanges:
    - Grid
  - type: PowerSwitch
  - type: Machine
    board: NFHolopadGridMachineCircuitboard
  - type: Sprite
    sprite: Structures/Machines/holopad.rsi
    drawdepth: HighFloorObjects
    snapCardinals: true
    layers:
    - state: nf_basegrid
    - map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      state: nf_unpoweredgrid
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: panel_open

- type: entity
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, NFHolopadShip]
  id: NFHolopadPoiBase
  suffix: POI
  abstract: true
  components:
