- type: entity
  parent: BoxFolderClipboardEmpty
  id: NFReinforcedClipboard
  name: reinforced clipboard
  description: A robust clipboard with a lockable cover. Perfect for waging bureaucratic war without scorching your paperwork, or a mothroach eating it.
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    layers:
    # needs all layers properly defined and mapped here cause of z-index/layering
    - state: reinforced_clipboard
      map: [ base ]
    - state: reinforced_clipboard_paper
      map: [ reinforced_clipboard_paper ]
      visible: false
    - state: reinforced_clipboard_clip
    # - state: clipboard_pen # if a pen sprite is to be defined, it should go here (z-index/layering fuckery), and the state/map names changed to the proper names
    #   map: ["clipboard_pen"]
    #   visible: false
    - state: reinforced_clipboard_cover_closed
      map: [ cover ]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: ItemMapper
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    mapLayers:
      reinforced_clipboard_paper: # contrary to the variable name (mapLayers), ItemMapper actually looks for states and not layer maps. what the fuck
        whitelist:
          tags:
          - Document
          - Write # if pen sprite is made this line should be commented,
      # clipboard_pen: # and also have to uncomment these
      #   whitelist:
      #     tags:
      #     - Write
  - type: AccessReader # moved around
  - type: Appearance # added
  - type: Item
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    heldPrefix: reinforced_clipboard
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      pen_slot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      pen_slot:
        name: clipboard-slot-component-slot-name-pen
        whitelist:
          tags:
          - Write
        insertOnInteract: false
  - type: Clothing
    slots: [belt]
    quickEquip: false
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    state: reinforced_clipboard_belt
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist:
      tags:
      - Document
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 8
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        cover:
          True: { state: reinforced_clipboard_cover_open}
          False: { state: reinforced_clipboard_cover_closed}
  - type: Lock
  - type: LockVisuals
  - type: LockedStorage
