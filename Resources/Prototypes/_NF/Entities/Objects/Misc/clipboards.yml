# Base Reinforced Clipboard
- type: entity
  parent: [ BoxFolderClipboardEmpty, ContentsExplosionResistanceBase ]
  id: NFReinforcedClipboardBase
  abstract: true
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    layers:
    - state: reinforced_clipboard
      map: [ base ]
    - state: reinforced_clipboard_paper
      map: [ reinforced_clipboard_paper ]
      visible: false
    - state: reinforced_clipboard_clip
    - state: reinforced_clipboard_cover_closed
      map: [ cover ]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: ItemMapper
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    mapLayers:
      reinforced_clipboard_paper: # TODO: why the fuck does this pull from state and not the actual mapped layer? this is evil, this is wrong, and I feel ragebaited. once someone makes this refer to the actual map instead of the state, this can be cut off from the variations. I hate it so fucking much
        whitelist:
          tags:
          - Document
  - type: AccessReader
    access: [ ]
  - type: Appearance
  - type: Item
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    heldPrefix: reinforced_clipboard
    size: Normal
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      pen_slot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      pen_slot:
        startingItem: LuxuryPen # we give paperworkers a little bit of a treat
        name: clipboard-slot-component-slot-name-pen
        whitelist:
          tags:
          - Write
        insertOnInteract: true
  - type: Clothing
    slots: [belt]
    quickEquip: false
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    equippedPrefix: reinforced_clipboard
  - type: Storage
    grid:
    - 0,0,3,8
    storageOpenSound: /Audio/Effects/woodenclosetopen.ogg
    storageCloseSound: /Audio/Effects/woodenclosetclose.ogg
    whitelist:
      tags:
      - Document
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 8
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        cover:
          True: { state: reinforced_clipboard_cover_open}
          False: { state: reinforced_clipboard_cover_closed}
  - type: Lock
  - type: LockVisuals
  - type: LockedStorage
  - type: ExplosionResistance
    damageCoefficient: 0

# Different damage limits - defined here when the variations share them
- type: entity
  id: NFReinforcedClipboardDestructibleDefault
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: NFReinforcedClipboardDestructibleTough
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

# Additional storage sizes - defined here when the variations share them. default is defined on NFReinforcedClipboardBase
- type: entity
  id: NFReinforcedClipboardStorageCommand
  abstract: true
  components:
  - type: Storage
    grid:
    - 0,0,4,8
    whitelist:
      tags:
      - Document

# Variations:
# Reinforced Clipboard - uses Base's default configuration.
- type: entity
  parent: [ NFReinforcedClipboardBase, NFReinforcedClipboardDestructibleDefault ]
  id: NFReinforcedClipboard
  name: reinforced clipboard
  description: A robust clipboard with a lockable cover. Perfect for waging bureaucratic war without scorching your paperwork, or a mothroach eating it.

# Weh.
- type: entity
  parent: [ NFReinforcedClipboardBase, NFReinforcedClipboardDestructibleDefault ]
  id: NFWehReinforcedClipboard
  name: wehboard
  description: Paperwehk!
  components:
  - type: Sprite
    layers:
    - state: weh_clipboard
      map: [ base ]
    - state: weh_clipboard_paper
      map: [ weh_clipboard_paper ]
      visible: false
    - state: reinforced_clipboard_clip
    - state: weh_clipboard_cover_closed
      map: [ cover ]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Item
    heldPrefix: weh_clipboard
  - type: Clothing
    equippedPrefix: weh_clipboard
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        cover:
          True: { state: weh_clipboard_cover_open}
          False: { state: weh_clipboard_cover_closed}
  - type: ItemMapper
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    mapLayers:
      weh_clipboard_paper:
        whitelist:
          components:
          - NFPlushie
          tags:
          - Document
  - type: Storage
    storageOpenSound:
      collection: Weh
      params:
        variation: 0.125
    storageCloseSound:
      collection: Weh
      params:
        variation: 0.125

# Bluespace Reinforced Clipboard
- type: entity
  parent: [ NFReinforcedClipboardBase, NFReinforcedClipboardDestructibleDefault ]
  id: NFBluespaceReinforcedClipboard
  name: clipboard of holding
  description: A robust clipboard with a lockable cover. Uses bluespace technology to create a localized pocket around itself, effectively shrinking itself and it's contents for remarkably easier storage
  components:
  - type: Sprite
    layers:
    - state: bluespace_clipboard
      map: [ base ]
    - state: bluespace_clipboard_paper
      map: [ bluespace_clipboard_paper ]
      visible: false
    - state: reinforced_clipboard_clip
    - state: bluespace_unlit
      shader: unshaded
    - state: reinforced_clipboard_cover_closed
      map: [ cover ]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Item
    heldPrefix: bluespace_clipboard
    size: Tiny # smaller
  - type: Clothing
    equippedPrefix: bluespace_clipboard
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        cover:
          True: { state: reinforced_clipboard_cover_open}
          False: { state: reinforced_clipboard_cover_closed}
  - type: ItemMapper
    sprite: _NF/Objects/Misc/bureaucracy.rsi
    mapLayers:
      bluespace_clipboard_paper:
        whitelist:
          tags:
          - Document
  - type: Storage
    grid:
    - 0,0,6,8
    whitelist:
      tags:
      - Document
  - type: Tag
    tags:
    - FitsWallet

