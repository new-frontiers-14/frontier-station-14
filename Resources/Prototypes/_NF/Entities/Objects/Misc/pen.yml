- type: entity
  name: public affairs pen
  parent: PenEmbeddable
  id: PublicAffairsPen
  description: A weighty fountain pen for NFSD paperwork wizards. Writes in a thin blue line.
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/pens.rsi
    state: pen_pal
  - type: Item
    sprite: _NF/Objects/Misc/pens.rsi
    heldPrefix: pen_pal

- type: entity
  id: NFBaseUnprotectedAdvancedPen
  parent: BaseAdvancedPen
  abstract: true
  components:
  - type: Tag
    tags:
    - Write
    - NFWriteIgnoreUnprotectedStamps # Weaker version of WriteIgnoreStamps
    - Pickaxe
    - Pen

- type: entity
  name: pipenette
  parent: [Pen, Dropper]
  id: PenPipette
  description: A pen with the added functionality of a dropper.
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/pens.rsi
    state: pen_pipenette
    layers:
      - state: pen_pipenette
      - state: pen_pipenette1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: _NF/Objects/Misc/pens.rsi
    heldPrefix: pen_pipenette
