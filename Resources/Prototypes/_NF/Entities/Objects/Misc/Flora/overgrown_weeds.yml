- type: entity
  id: NFOvergrownWeeds
  name: overgrown weeds
  description: Various weeds and herbs that have somehow overgrown the area.
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: Appearance
    - type: Transform
      anchored: true
    - type: Physics
    - type: Sprite
      sprite: _NF/Objects/Misc/overgrown_weeds.rsi
      layers:
      - state: overgrown_weeds1
        map: [ "weeds" ]
    - type: RandomSprite
      available:
        - weeds:
           overgrown_weeds1: ""
           overgrown_weeds2: ""
           overgrown_weeds3: ""
           overgrown_weeds4: ""
    - type: Clickable
    - type: Fixtures
      fixtures:
        fix1:
          hard: false
          density: 7
          shape:
            !type:PhysShapeAabb
            #bounds: "-0.5,-0.5,0.5,0.5"
          layer:
          - MidImpassable
    - type: Damageable
      damageModifierSet: Weeds
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Temperature
      heatDamage:
        types:
          Heat: 5
      coldDamage: {}
      coldDamageThreshold: 0
    - type: Flammable
      fireSpread: true
      damage:
        types:
          Heat: 3
    - type: Reactive
      groups:
        Flammable: [Touch]
        Extinguish: [Touch]
      reactions:
      - reagents: [WeedKiller, PlantBGone]
        methods: [Touch]
        effects:
        - !type:HealthChange
          scaleByQuantity: true
          damage:
            types:
              Heat: 0.5
    - type: AtmosExposed
    - type: SpeedModifierContacts
      walkSpeedModifier: 0.8
      sprintSpeedModifier: 0.5
      ignoreWhitelist:
        components:
        - IgnoreKudzu
    - type: Food
      requiresSpecialDigestion: true
      delay: 0.5
    - type: FlavorProfile
      flavors:
      - fiber
    - type: SolutionContainerManager
      solutions:
        food:
          reagents:
          - ReagentId: Nutriment
            Quantity: 2
    - type: Tag
      tags:
      - Ruminant