# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml

- type: entity
  name: carp taco
  parent: FoodTacoBase
  id: FoodTacoCarp
  description: Sounds kinda gross, but it's actually not that bad.
  components:
  - type: FlavorProfile
    flavors:
      - onion
      - fishy
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/meals.rsi
    layers:
    - state: carpfishtaco
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: CarpoToxin
          Quantity: 15

