- type: entity
  parent: BaseMachineCircuitboard
  id: SmartFridgeCircuitBoard
  name: smart fridge circuit board
  description: A machine printed circuit board for a smart fridge.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SmartFridgeMedical
    stackRequirements:
      Steel: 5
      Glass: 5
    requirements:
      MatterBin: 1
      Manipulator: 1

