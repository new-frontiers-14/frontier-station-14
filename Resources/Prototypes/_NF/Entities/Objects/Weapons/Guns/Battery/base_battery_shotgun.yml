#region frame
- type: entity
  abstract: true
  parent: [ NFBaseWeaponEncumbranceRifle, NFBaseGunMeleeAttackMedium, BaseWeaponBattery ]
  id: NFBaseWeaponFrameEnergyShotgun
  suffix: Frontier
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: Gun
    projectileSpeed: 30
    minAngle: 3.4
    maxAngle: 17
    angleIncrease: 0.9
    angleDecay: 4.5
    fireRate: 1.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  # - type: CursorOffsetRequiresWield
  # - type: EyeCursorOffset
    # maxOffset: 5
    # pvsIncrease: 0.5
  - type: Battery # Default: 30 shots with 80 fireCost
    maxCharge: 2400
    startingCharge: 2400
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 4 # Default recharge rate: 1 shot per 20 seconds with 80 fireCost
  - type: StaticPrice
    price: 400
  - type: NFWeaponDetails
    class: weapon-details-class-shotgun

#region manufacturer
- type: entity
  id: NFBaseWeaponFrameEnergyShotgunNanotrasen
  parent: NFBaseWeaponFrameEnergyShotgun
  abstract: true
  components:
  - type: Gun
    minAngle: 1.3
    maxAngle: 6.5
    angleIncrease: 0.4
    angleDecay: 1.4
    fireRate: 1.9
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-nanotrasen-munitions
    
#region chamber
- type: entity
  id: NFBaseWeaponEnergyShotgunFireModes
  abstract: true
  components:
  - type: Gun
    examineCaliber: gun-examine-energybolt-high
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: NFBulletLaserSpread
    fireCost: 80
  - type: EnergyGun
    fireModes:
    - proto: NFBulletLaserSpread
      fireCost: 80
      name: kill
      state: lethal
    - proto: NFBulletDisablerSpread
      fireCost: 80
      name: stun
      state: disabler
