- type: entity
  name: NFSD energy sword
  parent: [EnergySword, BaseC2ContrabandUnredeemable]
  id: eNFSDsword
  description: An NFSD energy sword, your righteous beam of light in the dark.
  components:
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 12
        Slash: 10
  - type: EnergySword
    colorOptions:
      - "#4f6e40"
    blockHacking: true
  - type: Sprite
    sprite: _NF/Objects/Weapons/Melee/e_nfsd.rsi
    layers:
    - state: e_sword
    - state: e_sword_blade
      color: "#FFFFFF"
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Item
    sprite: _NF/Objects/Weapons/Melee/e_nfsd-inhands_64x.rsi
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left-blade
        shader: unshaded
      right:
      - state: inhand-right-blade
        shader: unshaded

- type: entity
  id: NFEnergyPickaxe
  parent: [EnergySword, BaseC1Contraband] # Has a reflect chance
  name: holopickaxe
  description: A holographic mining tool with blades comprised of hard light. Doesn't pack the same punch as an energy weapon, but more compact than most mining tools when turned off.
  components:
  - type: ItemToggleSize
    activatedSize: Huge
    activatedShape:
    - 0,0,2,0
    - 1,1,1,2
  - type: ItemToggleMeleeWeapon
    activatedDamage:
        types: # Slightly less total damage than wielded crusher glaive has
          Heat: 8
          Piercing: 2
          Structural: 40 # +10 damage compared to crusher glaive
    deactivatedSecret: true
  - type: Sprite
    sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
    layers:
      - state: e-pickaxe
      - state: e-pickaxe-blade
        color: "#e95151"
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: Item
    sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
    storedRotation: -45
  - type: Clothing
    sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
    quickEquip: false
    slots:
    - Belt
    - back
    - suitStorage
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left-blade
        shader: unshaded
      right:
      - state: inhand-right-blade
        shader: unshaded
  - type: Reflect # Explicitly specified the value (the default one from the parent might be too high)
    reflectProb: 0.05
  - type: Tag
    tags:
    - Pickaxe
  - type: StaticPrice
    price: 200
  - type: MiningGatheringSoft
  - type: MiningGatheringHard
