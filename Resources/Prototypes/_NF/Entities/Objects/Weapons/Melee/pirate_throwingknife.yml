- type: entity
  name: pirate throwing knife
  parent: [BaseC3PirateContrabandNoValue, BaseSword]
  id: PirateThrowingKnife
  description: A small fancy looking knife used for throwing.
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Melee/pirate_throwing_knife.rsi
    layers:
    - state: icon
    - state: icon1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    scale: 0.65, 0.65
  - type: Item
    size: Small
  - type: MeleeWeapon
    autoAttack: true
    attackRate: 2
    wideAnimationRotation: -135
    animationOffset: 0.75
    damage:
      types:
        Piercing: 5
    range: 1.15
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tag
    tags:
    - NFPirateThrowingKnife
    - Knife
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 2
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: ExaminableSolution
    solution: melee
  - type: SolutionTransfer
    transferAmount: 1
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: icon
    inHandsFillBaseName: -fill-
    inHandsMaxFillLevels: 2
    equippedFillBaseName: -fill-
    equippedMaxFillLevels: 2
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 20
  - type: ThrowingAngle
    angle: 225
  - type: SolutionInjectOnEmbed
    transferAmount: 2
    solution: melee
