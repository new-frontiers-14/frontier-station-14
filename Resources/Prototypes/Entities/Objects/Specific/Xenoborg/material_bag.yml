- type: entity
  parent: [ NFBaseClothingBeltStorageBag, BaseXenoborgContraband ] # Frontier: BaseStorageItem<NFBaseClothingBeltStorageBag
  id: MaterialBag
  name: material bag
  description: A robust bag for Xenoborgs to carry large amounts of materials.
  components:
  - type: MagnetPickup
    magnetEnabled: false # Frontier
    magnetCanBeEnabled: false # Frontier
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    # Frontier: layered sprite
    layers:
    - state: icon
    - state: icon-on
      visible: False
      map: [ "enum.ToggleableVisuals.Layer" ]
    # End Frontier
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: Dumpable
  # Begin DeltaV Additions: toggle magnet from White Dream
  - type: ItemToggle
    soundActivate: &soundActivate
      collection: sparks
      params:
        variation: 0.25
    soundDeactivate: *soundActivate
    onUse: false
    onAltUse: true
    onActivate: false
  - type: ItemToggleExamine
    on: item-toggle-examine-magnet-on
    off: item-toggle-examine-magnet-off
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled: # Frontier: Enum changes from Wizden#35341
        enum.ToggleableVisuals.Layer: # Frontier: Enum changes from Wizden#35341
          True: { visible: True }
          False: { visible: False }
