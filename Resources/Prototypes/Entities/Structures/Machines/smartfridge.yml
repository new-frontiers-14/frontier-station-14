- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ] #Frontier: constructible smartfridge
  id: BaseSmartFridge #frontier BaseSmartFridge as the abstract parent to all variants
  abstract: true
  name: BaseSmartFridge
  components:
  - type: StationAiWhitelist
  - type: Vocalizer
    hideChat: true
  - type: VocalizerRequiresPower
  - type: Speech
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/smartfridge.rsi
    snapCardinals: true
    layers:
    - state: smartfridge
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartfridge_door
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
  - type: PointLight
    radius: 1.2
    energy: 3.0
    color: "#9dc5c9"
  - type: ContainerContainer
    containers:
      smart_fridge_inventory: !type:Container
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: SmartFridge
    whitelist: #frontier: fill in descendant prototype
      components:
      tags:
    title: smart-fridge-component-title #Frontier: change menu title to yml hardcoded in xaml
  - type: ActivatableUI
    key: enum.SmartFridgeUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.SmartFridgeUiKey.Key:
        type: SmartFridgeBoundUserInterface
  - type: AccessReader
  - type: UseDelay
    delay: 1
  - type: AntiRottingContainer
  - type: ResistLocker
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
    anchored: True
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Anchorable
    delay: 2
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:ChangeConstructionNodeBehavior #Frontier: Breaks into its repairable state
        node: machineFrame #Frontier: Breaks into its repairable state
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Repairable #Frontier: Can fix with welder
    doAfterDelay: 8
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: ExplosionResistance
    damageCoefficient: 0.1
  - type: BindToStation # Frontier
    enabled: false # Frontier - should be draggable between stations

#Frontier start: smartfridge variants
- type: entity # Frontier extends abstract BaseSmartFridge instead of defining values directly
  parent: BaseSmartFridge
  id: SmartAmmoMate
  name: Smart AmmoMate
  description: A smart ammo dispenser to organize your ordinance.
  components:
  - type: Machine
    board: SmartAmmoMateCircuitBoard
  - type: SmartFridge
    whitelist:
      components:
      - Cartridge
      - BallisticAmmoProvider
      tags:
      - HandGrenade
    title: smart-ammomate-component-title
  - type: Sprite
    sprite: Structures/Machines/SmartAmmoMate.rsi
    snapCardinals: true
    layers:
    - state: smartammomate
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartammomate_door
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded

