- type: entity
  parent: BaseSmartFridge
  id: SmartFridgeMedical
  name: Smart Fridge
  description: A refrigerated storage unit for keeping items cold and fresh.
  suffix: Medical
  categories: [ HideSpawnMenu ] # Frontier, hide this one as we don't use the access systems for it.
  components:
  - type: Machine
    board: SmartFridgeCircuitBoard
  - type: AccessReader
    access: [["Medical"]]
  - type: DatasetVocalizer
