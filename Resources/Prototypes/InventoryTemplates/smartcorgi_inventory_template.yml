# Borgi Inventory Template
- type: inventoryTemplate
  id: SmartCorgi
  slots:
  - name: ears
    slotTexture: ears
    slotFlags: EARS
    stripTime: 3
    uiWindowPos: 2,2
    strippingWindowPos: 2,0
    displayName: Ears
  - name: mask
    slotTexture: mask
    slotFlags: MASK
    uiWindowPos: 1,2 # Starlight
    strippingWindowPos: 1,1 # Starlight
    displayName: Mask
    whitelist:
      tags:
      - PetWearable
      components:
      - CorgiWearable #Starlight
    blacklist:
      components:
      - DisableCorgiWearable
  - name: suitstorage
    slotTexture: suit_storage
    slotFlags: SUITSTORAGE
    stripTime: 3
    uiWindowPos: 0,1
    strippingWindowPos: 2,5
    displayName: Suit Storage
    whitelist:
      components:
      - GasTank
  - name: id
    slotTexture: id
    fullTextureName: template_small
    slotFlags: IDCARD
    slotGroup: SecondHotbar
    stripTime: 2
    uiWindowPos: 2,1
    strippingWindowPos: 2,4
    displayName: ID
  - name: belt
    slotTexture: belt
    fullTextureName: template_small
    slotFlags: BELT
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,1
    strippingWindowPos: 1,5
    displayName: Belt
  - name: outerClothing
    slotTexture: suit
    slotFlags: OUTERCLOTHING
    stripTime: 6
    uiWindowPos: 1,1 # Starlight adjusted
    strippingWindowPos: 1,2 # Starlight adjusted
    displayName: Suit
    whitelist:
      components:
      - CorgiWearable
    blacklist:
      components:
      - DisableCorgiWearable
  - name: eyes
    slotTexture: glasses
    slotFlags: EYES
    uiWindowPos: 0,3 # Starlight adjusted
    strippingWindowPos: 0,0 # Starlight adjusted
    displayName: Eyes
    whitelist:
      tags:
      - PetWearable
      components:
      - CorgiWearable #Starlight adjusted
    blacklist:
      components:
      - DisableCorgiWearable
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,3
    strippingWindowPos: 1,0
    displayName: Head
    whitelist:
      components:
      - CorgiWearable
    blacklist:
      components:
      - DisableCorgiWearable
  - name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,0
    strippingWindowPos: 0,5
    displayName: Back
    whitelist:
      components:
      - CorgiWearable
    blacklist:
      components:
      - DisableCorgiWearable
# Starlight Start
  - name: neck
    slotTexture: neck
    slotFlags: NECK
    uiWindowPos: 0,2
    strippingWindowPos: 0,1
    displayName: Neck
    whitelist:
      components:
      - CorgiWearable
    blacklist:
      components:
      - DisableCorgiWearable
# Starlight End

  # Frontier: wallet slot
  - name: wallet
    slotTexture: wallet
    slotFlags: WALLET
    stripTime: 6
    uiWindowPos: 2,0
    strippingWindowPos: 2,3
    displayName: Wallet
  # End Frontier: wallet slot
